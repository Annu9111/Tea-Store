<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narmada Leaf – Small-batch tea store</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2E8;--surface:#FFFFFF;--ink:#1E2A22;--muted:#5C6A60;--line:#D3DBCB;--accent:#E89A0C;--accent-ink:#2A1A00;--chili:#B93A24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141B16;--surface:#1D2720;--ink:#EDF2E8;--muted:#9BAA9F;--line:#2D3A31;--accent:#F2A927;--accent-ink:#2A1A00;--chili:#F0765F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141B16;--surface:#1D2720;--ink:#EDF2E8;--muted:#9BAA9F;--line:#2D3A31;--accent:#F2A927;--accent-ink:#2A1A00;--chili:#F0765F}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 Karla,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{font:800 1.35rem 'Bricolage Grotesque',sans-serif;margin-right:auto}
.search{flex:1;max-width:320px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit}
.cartbtn{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:9px 16px;font-weight:600}
.cartbtn span{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 8px;margin-left:6px}
.hero{padding:56px 0 28px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;max-width:14ch;letter-spacing:-.02em}
.hero p{max-width:46ch;color:var(--muted);font-size:1.1rem;margin:16px 0 22px}
.strength{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:560px}
.strength label{font-weight:600}
.strength input{flex:1;min-width:140px;accent-color:var(--accent)}
.strength output{min-width:7ch;font-weight:700;color:var(--chili)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.art{display:grid;place-items:center;padding:20px;border:0;width:100%;background:var(--tint)}
.art svg{width:96px;height:auto}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.1rem}
.meta{color:var(--muted);font-size:.9rem}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:1.1rem}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.add:active{transform:scale(.96)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.scrim.on{display:block}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:11;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;font-size:1.6rem;line-height:1}
.items{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;grid-column:1/3}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none}
.rm{margin-left:auto;background:none;border:0;color:var(--chili);text-decoration:underline}
.ship{font-size:.9rem;color:var(--muted);margin:10px 0}
.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:8px 0 12px}
.pay{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.pay:disabled{opacity:.4;cursor:not-allowed}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:24px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.notes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.notes span{background:var(--bg);border-radius:99px;padding:3px 11px;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Narmada Leaf</div>
  <input class="search" id="q" type="search" placeholder="Search teas" aria-label="Search teas">
  <button class="cartbtn" id="open" aria-label="Open cart">Cart<span id="count">0</span></button>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Tea picked, packed and shipped in small batches.</h1>
    <p>Assam, Darjeeling, Nilgiri and house-blended masala chai. Tell us how strong you like it and we'll show what fits.</p>
    <div class="strength">
      <label for="str">Your strength</label>
      <input id="str" type="range" min="1" max="5" value="3">
      <output id="strout" for="str">Balanced</output>
    </div>
  </section>

  <div class="tools" id="tools" role="group" aria-label="Filter by category">
    <button class="chip" aria-pressed="true" data-c="All">All</button>
    <button class="chip" aria-pressed="false" data-c="Chai">Chai</button>
    <button class="chip" aria-pressed="false" data-c="Black">Black</button>
    <button class="chip" aria-pressed="false" data-c="Green">Green</button>
    <button class="chip" aria-pressed="false" data-c="Herbal">Herbal</button>
    <select id="sort" aria-label="Sort products">
      <option value="best">Best match</option>
      <option value="lo">Price: low to high</option>
      <option value="hi">Price: high to low</option>
      <option value="rate">Top rated</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">Demo store. No real payments are taken.</div></footer>

<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="Shopping cart" aria-hidden="true">
  <div class="ch"><h2>Your cart</h2><button class="x" id="close" aria-label="Close cart">&times;</button></div>
  <div class="items" id="items"></div>
  <div class="ship" id="ship"></div>
  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <button class="pay" id="pay">Place order</button>
</aside>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const P=[
{id:1,n:"Assam Breakfast",c:"Black",p:349,s:5,r:4.8,col:"#8A3B1E",t:"#F1D9C8",d:"Malty, bold and made for milk.",notes:["Malty","Brisk","Honey"]},
{id:2,n:"Darjeeling First Flush",c:"Black",p:649,s:2,r:4.7,col:"#C9962B",t:"#F4E7BF",d:"Light and floral with a muscatel finish.",notes:["Floral","Muscatel","Light"]},
{id:3,n:"Kadak Masala Chai",c:"Chai",p:299,s:5,r:4.9,col:"#B93A24",t:"#F6D3CB",d:"CTC leaf with ginger, cardamom and clove.",notes:["Ginger","Cardamom","Strong"]},
{id:4,n:"Elaichi Chai",c:"Chai",p:279,s:4,r:4.6,col:"#4F7A4A",t:"#D9E8D3",d:"Cardamom-forward and gently sweet.",notes:["Cardamom","Smooth"]},
{id:5,n:"Nilgiri Green",c:"Green",p:399,s:2,r:4.4,col:"#2F7D5B",t:"#CFEADB",d:"Clean, grassy and fresh from the hills.",notes:["Grassy","Fresh"]},
{id:6,n:"Kashmiri Kahwa",c:"Green",p:549,s:2,r:4.7,col:"#9A5C86",t:"#EBD5E4",d:"Saffron, almond and green tea.",notes:["Saffron","Almond"]},
{id:7,n:"Tulsi Ginger",c:"Herbal",p:329,s:1,r:4.5,col:"#5A8F2E",t:"#DFEDC9",d:"Caffeine-free holy basil with ginger.",notes:["Caffeine-free","Warm"]},
{id:8,n:"Lemongrass Mint",c:"Herbal",p:299,s:1,r:4.3,col:"#7BA02A",t:"#E6F0C2",d:"Bright and cooling, hot or iced.",notes:["Citrus","Cooling"]}
];
const names=["","Mild","Light","Balanced","Strong","Extra strong"];
let cat="All",q="",sort="best",strength=3,cart={};
try{cart=JSON.parse(localStorage.getItem("nl-cart")||"{}")}catch(e){}
const $=s=>document.querySelector(s),inr=n=>"₹"+n.toLocaleString("en-IN");
const tin=(c)=>`<svg viewBox="0 0 80 100" aria-hidden="true"><rect x="12" y="14" width="56" height="78" rx="9" fill="${c}"/><rect x="8" y="8" width="64" height="14" rx="5" fill="${c}" opacity=".75"/><rect x="22" y="38" width="36" height="30" rx="5" fill="#fff" opacity=".88"/><path d="M40 44c-7 6-7 14 0 18 7-4 7-12 0-18z" fill="${c}"/></svg>`;
function save(){try{localStorage.setItem("nl-cart",JSON.stringify(cart))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
function list(){
  let a=P.filter(x=>(cat==="All"||x.c===cat)&&x.n.toLowerCase().includes(q));
  const d=x=>Math.abs(x.s-strength);
  if(sort==="best")a.sort((x,y)=>d(x)-d(y)||y.r-x.r);
  if(sort==="lo")a.sort((x,y)=>x.p-y.p);
  if(sort==="hi")a.sort((x,y)=>y.p-x.p);
  if(sort==="rate")a.sort((x,y)=>y.r-x.r);
  $("#grid").innerHTML=a.length?a.map(x=>`<article class="card"><button class="art" style="--tint:${x.t}" data-v="${x.id}" aria-label="View ${x.n}">${tin(x.col)}</button><div class="info"><h3>${x.n}</h3><div class="meta">${x.c} tea · ★ ${x.r}</div><div class="row"><span class="price">${inr(x.p)}</span><button class="add" data-a="${x.id}">Add to cart</button></div></div></article>`).join(""):`<div class="empty">No teas match "${q}". Try a different word or clear the filter.</div>`;
}
function render(){
  const ids=Object.keys(cart),n=ids.reduce((s,i)=>s+cart[i],0),sub=ids.reduce((s,i)=>s+cart[i]*P.find(x=>x.id==i).p,0);
  $("#count").textContent=n;
  $("#items").innerHTML=ids.length?ids.map(i=>{const x=P.find(y=>y.id==i);return `<div class="line"><strong>${x.n}</strong><span>${inr(x.p*cart[i])}</span><div class="qty"><button data-m="${i}" aria-label="Decrease ${x.n}">−</button><span>${cart[i]}</span><button data-p="${i}" aria-label="Increase ${x.n}">+</button><button class="rm" data-r="${i}">Remove</button></div></div>`}).join(""):`<p class="meta">Your cart is empty. Add a tea to get started.</p>`;
  const left=Math.max(0,799-sub);
  $("#ship").innerHTML=(left?`Add ${inr(left)} more for free shipping`:"You get free shipping")+`<div class="meter"><i style="width:${Math.min(100,sub/799*100)}%"></i></div>`;
  $("#total").textContent=inr(sub+(sub&&sub<799?49:0));
  $("#pay").disabled=!n;save();
}
function openCart(o){$("#cart").classList.toggle("on",o);$("#scrim").classList.toggle("on",o);$("#cart").setAttribute("aria-hidden",!o);if(o)$("#close").focus()}
function add(id){cart[id]=(cart[id]||0)+1;render();toast(P.find(x=>x.id==id).n+" added to cart")}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.a)add(t.dataset.a);
  if(t.dataset.v){const x=P.find(y=>y.id==t.dataset.v),d=$("#dlg");d.innerHTML=`<div style="background:${x.t};border-radius:12px;display:grid;place-items:center;padding:18px">${tin(x.col)}</div><h2 style="margin-top:14px">${x.n}</h2><p>${x.d}</p><div class="notes">${x.notes.map(n=>`<span>${n}</span>`).join("")}</div><div class="row" style="padding:0"><span class="price">${inr(x.p)}</span><span><button class="chip" data-x>Close</button> <button class="add" data-a="${x.id}" data-x>Add to cart</button></span></div>`;d.showModal()}
  if(t.hasAttribute("data-x"))$("#dlg").close();
  if(t.dataset.p){cart[t.dataset.p]++;render()}
  if(t.dataset.m){if(--cart[t.dataset.m]<1)delete cart[t.dataset.m];render()}
  if(t.dataset.r){delete cart[t.dataset.r];render()}
  if(t.dataset.c){cat=t.dataset.c;document.querySelectorAll(".chip[data-c]").forEach(c=>c.setAttribute("aria-pressed",c===t));list()}
});
$("#open").onclick=()=>openCart(true);$("#close").onclick=$("#scrim").onclick=()=>openCart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")openCart(false)});
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();list()};
$("#sort").onchange=e=>{sort=e.target.value;list()};
$("#str").oninput=e=>{strength=+e.target.value;$("#strout").textContent=names[strength];if(sort==="best")list()};
$("#pay").onclick=()=>{cart={};render();openCart(false);toast("Order placed. Thank you!")};
list();render();
</script>
</body>
</html>
